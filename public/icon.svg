<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="#05050e" rx="36"/>
  <defs>
    <linearGradient id="g1" x1="40" y1="60" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g2" x1="60" y1="30" x2="120" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <!-- Constellation lines -->
  <g stroke="url(#g1)" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <line x1="50" y1="90" x2="92" y2="58"/>
    <line x1="92" y1="58" x2="132" y2="90"/>
    <line x1="132" y1="90" x2="110" y2="130"/>
    <line x1="110" y1="130" x2="70" y2="130"/>
    <line x1="70" y1="130" x2="50" y2="90"/>
  </g>
  <!-- Stars (constellation nodes) -->
  <g fill="url(#g2)">
    <circle cx="50" cy="90" r="7"/>
    <circle cx="92" cy="58" r="5.5"/>
    <circle cx="132" cy="90" r="8"/>
    <circle cx="110" cy="130" r="5.5"/>
    <circle cx="70" cy="130" r="5"/>
  </g>
  <!-- Sharper highlight on top-right star -->
  <circle cx="132" cy="90" r="2.4" fill="#ffffff"/>
</svg>
